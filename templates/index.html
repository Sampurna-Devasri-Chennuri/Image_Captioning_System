<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionary | AI Image Captioning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Visionary.AI</div>
        <div class="nav-links">
            <a href="/about" style="color: var(--text-dim); text-decoration: none; font-weight: 600;">About</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Vision to <span style="color: var(--primary)">Vocabulary</span></h1>
            <p style="color: var(--text-dim); font-size: 1.2rem;">Upload an image and let our neural networks describe the world for you.</p>
        </div>

        <div class="glass-card">
            <div class="upload-zone" id="upload-zone">
                <input type="file" id="file-input" hidden accept="image/*">
                <div id="upload-prompt">
                    <div style="font-size: 4rem; margin-bottom: 1rem;">📂</div>
                    <h3>Drag & Drop or Click to Upload</h3>
                    <p style="color: var(--text-dim); margin-top: 0.5rem;">Supports JPG, PNG, WebP</p>
                </div>
                <img id="image-preview" alt="Preview">
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <button id="generate-btn" class="btn" style="display: none;">Generate Caption</button>
            </div>

            <div class="loader" id="loader"></div>

            <div class="result-area" id="result-area">
                <div class="caption-result" id="caption-text"></div>
                <div style="margin-top: 2rem; text-align: center;">
                    <button class="btn" style="background: rgba(255,255,255,0.1);" onclick="location.reload()">Upload New</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Visionary AI System. Powered by Salesforce BLIP.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
